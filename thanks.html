<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap">
<style>
:root{--iris:#5B5BD6;--page:#FBFAFF;--paper:#fff;--ink:#1B1830;--muted:#6B6785;--line:#EAE8F5}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:blur(60px);opacity:.5}
.amb span{position:absolute;border-radius:50%;display:block}
.amb .a{width:460px;height:460px;background:#DADAF8;top:-120px;left:-100px;animation:d1 26s ease-in-out infinite}
.amb .b{width:420px;height:420px;background:#FFE2D6;bottom:-140px;right:-120px;animation:d2 30s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,50px) scale(1.1)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-60px) scale(1.08)}}
.box{position:relative;z-index:1;max-width:520px}
h1{font-family:Outfit,sans-serif;font-size:clamp(2rem,5vw,2.8rem);font-weight:800;letter-spacing:-.03em;margin:0 0 12px;line-height:1.1}
p{color:var(--muted);font-size:1.08rem;margin:0 auto;max-width:42ch}
img{width:180px;margin:0 auto 8px;display:block;animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.btn{font:inherit;font-weight:700;font-size:.95rem;padding:13px 26px;border-radius:100px;text-decoration:none;
  background:var(--iris);color:#fff;box-shadow:0 6px 18px rgba(91,91,214,.3);transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
.btn.g{background:var(--paper);color:var(--iris);border:1px solid var(--line);box-shadow:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
