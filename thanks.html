<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3b6050">
  <title>You're on the list — One Call Away</title>
  <link rel="stylesheet" href="landing.css">
  <style>
    body{min-height:100svh;display:grid;place-items:center;padding:24px;background:#e9f0ec}
    main{width:min(480px,100%);background:white;padding:32px;border-radius:25px;text-align:center}
    .brand{justify-content:center;font-size:20px;margin-bottom:25px}
    img{width:100%;height:230px;object-fit:cover;border-radius:16px}
    h1{font-size:36px;letter-spacing:-1.5px;margin:24px 0 16px}
    p{font-size:14px;color:var(--muted);margin-bottom:25px}
    .button{width:100%;margin-top:10px}
  </style>
</head>
<body><main>
  <a class="brand" href="index.html">onecallaway<span class="brand-dot">.</span></a>
  <img src="assets/generated/reminder-calendar.jpg" width="1200" height="800" alt="A green calendar with a checkmark and a lavender bell">
  <h1 id="heading">You're on the list.</h1>
  <p id="message">We’ll email you when the Android beta is ready. In the meantime, take a look around the app.</p>
  <a class="button" href="mockup.html?mode=interactive&screen=welcome" id="explore">Explore the app</a>
  <a class="button outline" href="index.html" id="back">Back to the website</a>
</main>
<script>
if(new URLSearchParams(location.search).get('lang')==='id'){
  document.documentElement.lang='id';document.title='Kamu terdaftar — One Call Away';
  document.querySelector('#heading').textContent='Kamu sudah terdaftar.';
  document.querySelector('#message').textContent='Kami akan mengirim email saat beta Android siap. Sambil menunggu, jelajahi aplikasinya.';
  document.querySelector('#explore').textContent='Jelajahi aplikasi';
  document.querySelector('#back').textContent='Kembali ke website';
}
</script>
</body></html>
